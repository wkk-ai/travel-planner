<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>01 · Command bar</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    /* Row 1: identity + search + overflow only */
    .r1 {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
    }
    .trip { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .trip h1 { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trip p { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .r1 .search { flex: 1; max-width: 280px; }
    .r1 .actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    /* Row 2: tabs + date nav unified */
    .r2 {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      min-height: 48px;
    }
    .r2 .tabs-inline { display: flex; gap: 2px; }
    .r2 .tabs-inline button {
      border: none; background: transparent; font-family: inherit;
      font-size: 14px; font-weight: 600; padding: 12px 14px;
      color: var(--muted); border-bottom: 2px solid transparent; cursor: default;
    }
    .r2 .tabs-inline button.on { color: var(--blue); border-bottom-color: var(--blue); }
    .r2 .divider { width: 1px; height: 24px; background: var(--line); }
    .date-nav { display: flex; align-items: center; gap: 4px; flex: 1; }
    .date-nav strong { font-size: 15px; font-weight: 700; min-width: 120px; text-align: center; }
    .r2 .filters { display: flex; gap: 8px; align-items: center; }
    .chip-filter {
      font-size: 12px; font-weight: 600; color: var(--muted);
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 6px 10px;
    }
    .meta-pill {
      font-size: 11px; font-weight: 600; color: var(--blue);
      background: #e8f0fe; padding: 4px 8px; border-radius: 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Schedule header mockups</a>
  <p class="label">01 · Command bar</p>
  <div class="phone">
  <div class="r1">
    <div class="trip">
      <div class="trip-icon">📅</div>
      <div style="min-width:0">
        <h1>BigBang US Trip 2026 ▾</h1>
        <p>21 days until departure · Concert in 27d</p>
      </div>
    </div>
    <div class="search"><span>🔍</span> Search events…</div>
    <div class="actions">
      <span class="live"><i></i> Live</span>
      <button class="btn btn-primary">+ Add</button>
      <button class="icon" title="More">⋯</button>
    </div>
  </div>
  <div class="r2">
    <div class="tabs-inline">
      <button>Story</button>
      <button class="on">Schedule</button>
    </div>
    <div class="divider"></div>
    <div class="pill"><button class="on">Day</button><button>Week</button></div>
    <div class="date-nav">
      <button class="icon sm">‹</button>
      <strong>Sun, Aug 30</strong>
      <button class="icon sm">›</button>
    </div>
    <div class="filters">
      <span class="chip-filter">Aug 30 ▾</span>
      <span class="chip-filter">All ▾</span>
      <span class="meta-pill">Plan · Share in ⋯</span>
    </div>
  </div>
  <div class="cal">
    <div class="cal-grid">
      <div class="h"></div><div class="h">Sun</div><div class="h">Mon</div><div class="h">Tue</div><div class="h">Wed</div><div class="h">Thu</div><div class="h">Fri</div><div class="h">Sat</div>
      <div class="h">7am</div>
      <div class="t on"><div class="ev meal">Breakfast</div></div>
      <div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
      <div class="h">9am</div>
      <div class="t on"><div class="ev park">Target</div></div>
      <div class="t"></div><div class="t"><div class="ev park">Magic K.</div></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
      <div class="h">2pm</div>
      <div class="t on"><div class="ev meal">Lunch</div></div>
      <div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
    </div>
  </div>
  </div>
</body>
</html>
