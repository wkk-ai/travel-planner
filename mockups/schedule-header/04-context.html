<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04 · Context card</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .wrap { padding: 12px 16px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(60,64,67,.06);
      margin-bottom: 12px;
    }
    .section {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f3f4;
    }
    .section:last-child { border-bottom: none; }
    .section-h {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .trip-row { display: flex; align-items: center; gap: 10px; }
    .trip-row h1 { font-size: 15px; font-weight: 700; }
    .trip-row p { font-size: 12px; color: var(--muted); }
    .trip-actions { margin-left: auto; display: flex; gap: 4px; align-items: center; }
    .view-row { display: flex; gap: 8px; align-items: center; }
    .view-row .tabs-mini {
      display: flex; flex: 1; background: var(--bg); border-radius: 8px; padding: 3px;
    }
    .view-row .tabs-mini button {
      flex: 1; border: none; background: transparent; font-family: inherit;
      font-size: 13px; font-weight: 600; padding: 7px; border-radius: 6px;
      color: var(--muted); cursor: default;
    }
    .view-row .tabs-mini button.on { background: #fff; color: var(--blue); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .day-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .day-row .nav { display: flex; align-items: center; gap: 6px; }
    .day-row .nav strong { font-size: 15px; font-weight: 700; min-width: 110px; text-align: center; }
    .day-row .filters { display: flex; gap: 6px; justify-content: flex-end; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Schedule header mockups</a>
  <p class="label">04 · Context card</p>
  <div class="phone">
  <div class="wrap">
    <div class="card">
      <div class="section">
        <div class="section-h">Trip</div>
        <div class="trip-row">
          <div class="trip-icon">📅</div>
          <div>
            <h1>BigBang US Trip 2026</h1>
            <p>21 days until departure · Concert in 27d</p>
          </div>
          <div class="trip-actions">
            <span class="live"><i></i> Live</span>
            <button class="icon sm">🔍</button>
            <button class="btn btn-primary" style="padding:6px 12px;font-size:12px">+ Add</button>
            <button class="icon sm">⋯</button>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="section-h">View</div>
        <div class="view-row">
          <div class="tabs-mini">
            <button>Story</button>
            <button class="on">Schedule</button>
          </div>
          <div class="pill"><button class="on">Day</button><button>Week</button></div>
        </div>
      </div>
      <div class="section">
        <div class="section-h">Day</div>
        <div class="day-row">
          <div class="nav">
            <button class="icon sm">‹</button>
            <strong>Sun, Aug 30</strong>
            <button class="icon sm">›</button>
          </div>
          <div></div>
          <div class="filters">
            <span class="sel">Sun 30/08 ▾</span>
            <span class="sel">All ▾</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="cal" style="border-top:none">
    <div class="cal-grid">
      <div class="h"></div><div class="h">Sun</div><div class="h">Mon</div><div class="h">Tue</div><div class="h">Wed</div><div class="h">Thu</div><div class="h">Fri</div><div class="h">Sat</div>
      <div class="h">7am</div>
      <div class="t on"><div class="ev meal">Breakfast</div></div>
      <div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
      <div class="h">9am</div>
      <div class="t on"><div class="ev park">Target</div></div>
      <div class="t"></div><div class="t"><div class="ev park">Magic K.</div></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
    </div>
  </div>
  </div>
</body>
</html>
