<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>03 · Split zones</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 120px;
      border-bottom: 1px solid var(--line);
    }
    .zone-left {
      border-right: 1px solid var(--line);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .zone-right {
      padding: 14px 16px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .zone-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .trip-block { display: flex; gap: 10px; align-items: flex-start; }
    .trip-block h1 { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .trip-block p { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tabs-stack { display: flex; flex-direction: column; gap: 4px; }
    .tabs-stack button {
      text-align: left; border: 1px solid var(--line); background: #fff;
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 12px; border-radius: 8px; color: var(--muted); cursor: default;
    }
    .tabs-stack button.on {
      border-color: #c2d7f7; background: #e8f0fe; color: var(--blue);
    }
    .schedule-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .schedule-row .date { font-size: 16px; font-weight: 700; flex: 1; }
    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .top-actions .search { flex: 1; max-width: 240px; margin-right: auto; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Schedule header mockups</a>
  <p class="label">03 · Split zones</p>
  <div class="phone">
  <div class="top-actions">
    <div class="search"><span>🔍</span> Search events…</div>
    <span class="live"><i></i> Live</span>
    <button class="btn btn-primary">+ Add</button>
    <button class="icon sm">↩</button>
    <button class="icon sm">⋯</button>
  </div>
  <div class="split">
    <div class="zone-left">
      <span class="zone-label">Your trip</span>
      <div class="trip-block">
        <div class="trip-icon">📅</div>
        <div>
          <h1>BigBang US Trip 2026</h1>
          <p>21 days until departure<br>Concert in 27d</p>
        </div>
      </div>
      <span class="zone-label">View</span>
      <div class="tabs-stack">
        <button>Story — upcoming days</button>
        <button class="on">Schedule — calendar</button>
      </div>
    </div>
    <div class="zone-right">
      <span class="zone-label">Schedule controls</span>
      <div class="pill" style="width:fit-content"><button class="on">Day</button><button>Week</button></div>
      <div class="schedule-row">
        <button class="icon sm">‹</button>
        <span class="date">Sun, Aug 30</span>
        <button class="icon sm">›</button>
      </div>
      <div style="display:flex;gap:8px">
        <span class="sel" style="flex:1">Sun 30/08 ▾</span>
        <span class="sel">All ▾</span>
      </div>
    </div>
  </div>
  <div class="cal">
    <div class="cal-grid">
      <div class="h"></div><div class="h">Sun</div><div class="h">Mon</div><div class="h">Tue</div><div class="h">Wed</div><div class="h">Thu</div><div class="h">Fri</div><div class="h">Sat</div>
      <div class="h">7am</div>
      <div class="t on"><div class="ev meal">Breakfast</div></div>
      <div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
      <div class="h">9am</div>
      <div class="t on"><div class="ev park">Target</div></div>
      <div class="t"></div><div class="t"><div class="ev park">Magic K.</div></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
    </div>
  </div>
  </div>
</body>
</html>
