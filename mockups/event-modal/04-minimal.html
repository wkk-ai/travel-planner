<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04 · Minimal rows</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .modal { border-radius: 20px; }
    .hdr {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--line-soft);
      position: relative;
    }
    .hdr .x { position: absolute; right: 14px; top: 14px; border: none; background: none; font-size: 22px; color: var(--muted); }
    .hdr input {
      width: 100%; border: none; font-size: 22px; font-weight: 700;
      font-family: inherit; outline: none; padding-right: 28px;
    }
    .rows { padding: 4px 0; }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line-soft);
    }
    .row:last-child { border-bottom: none; }
    .row .icon { width: 28px; text-align: center; font-size: 16px; flex-shrink: 0; }
    .row .lbl { width: 72px; font-size: 13px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
    .row .val { flex: 1; font-size: 14px; font-weight: 500; }
    .row input, .row select {
      flex: 1; border: none; font-family: inherit; font-size: 14px;
      font-weight: 500; background: transparent; outline: none; text-align: right;
    }
    .row .pills { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex: 1; }
    .row .pill { padding: 4px 9px; font-size: 10px; }
    .backup { padding: 14px 16px; background: var(--bg); font-size: 13px; color: var(--muted); }
    .backup b { color: var(--blue); font-weight: 600; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Event modal mockups</a>
  <p class="label">04 · Minimal rows</p>
  <div class="scene">
    <div class="dim" style="align-items:flex-end;padding:0">
      <div class="modal" style="border-radius:20px 20px 0 0;max-height:88vh">
        <div class="hdr">
          <button class="x">×</button>
          <input value="Dinner at hotel" />
        </div>
        <div class="scroll rows">
          <div class="row">
            <span class="icon">📅</span>
            <span class="lbl">When</span>
            <input type="date" value="2026-08-08" />
          </div>
          <div class="row">
            <span class="icon">🕐</span>
            <span class="lbl">Time</span>
            <input value="22:30 – 23:00" />
          </div>
          <div class="row">
            <span class="icon">🏷</span>
            <span class="lbl">Type</span>
            <div class="pills">
              <span class="pill meal on">Meal</span>
              <span class="pill other">Other</span>
            </div>
          </div>
          <div class="row">
            <span class="icon">📍</span>
            <span class="lbl">Place</span>
            <input value="Hotel lobby" placeholder="Add place" />
          </div>
          <div class="row">
            <span class="icon">🔗</span>
            <span class="lbl">Maps</span>
            <input placeholder="Paste link" />
          </div>
          <div class="row">
            <span class="icon">📝</span>
            <span class="lbl">Notes</span>
            <input placeholder="Optional" />
          </div>
          <div class="row">
            <span class="icon">💵</span>
            <span class="lbl">Budget</span>
            <input value="$0" />
          </div>
          <div class="row">
            <span class="icon">📷</span>
            <span class="lbl">Photo</span>
            <span class="val" style="color:var(--blue);font-weight:600;text-align:right">Add</span>
          </div>
        </div>
        <div class="backup">Backup plans · <b>+ Add alternative</b></div>
        <div class="footer">
          <button class="btn btn-danger">Delete</button>
          <button class="btn btn-primary" style="margin-left:auto">Save</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
