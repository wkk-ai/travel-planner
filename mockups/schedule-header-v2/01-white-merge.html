<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>01 · White merge</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../schedule-header/_shared.css" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .r1-clean .search { border-color: var(--line); }
    .live { background: transparent; color: var(--muted); padding: 0 6px; }
    .live i { background: #34a853; }
    .btn-primary { padding: 7px 16px; font-size: 13px; }
    .merge { gap: 0; }
    .date-nav { justify-content: center; }
    .date-nav strong { font-size: 15px; min-width: 108px; text-align: center; }
    .pill { border-color: var(--line); background: #fff; }
    .pill button { padding: 5px 11px; font-size: 12px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Round 2 mockups</a>
  <p class="label">01 · White merge</p>
  <div class="phone">
    <div class="r1-clean">
      <div class="trip">
        <div class="trip-icon">📅</div>
        <div style="min-width:0">
          <h1>BigBang US Trip 2026 ▾</h1>
          <p>21 days until departure · Concert in 27d</p>
        </div>
      </div>
      <div class="search"><span>🔍</span> Search events…</div>
      <div class="actions">
        <span class="live"><i></i> Live</span>
        <button class="btn btn-primary">+ Add</button>
        <button class="icon-ghost">⋯</button>
      </div>
    </div>
    <div class="merge">
      <div class="tabs-underline">
        <button>Story</button>
        <button class="on">Schedule</button>
      </div>
      <div class="vdiv"></div>
      <div class="pill"><button class="on">Day</button><button>Week</button></div>
      <div class="vdiv"></div>
      <div class="date-nav grow">
        <button class="icon-ghost" style="width:30px;height:30px">‹</button>
        <strong>Sun, Aug 30</strong>
        <button class="icon-ghost" style="width:30px;height:30px">›</button>
      </div>
      <div class="vdiv"></div>
      <div class="filter-icons">
        <button class="icon-ghost" title="Jump to day">📅</button>
        <button class="icon-ghost" title="Filter">⧉</button>
      </div>
    </div>
    <div class="cal">
      <div class="cal-grid">
        <div class="h"></div><div class="h">Sun</div><div class="h">Mon</div><div class="h">Tue</div><div class="h">Wed</div><div class="h">Thu</div><div class="h">Fri</div><div class="h">Sat</div>
        <div class="h">7am</div>
        <div class="t on"><div class="ev meal">Breakfast</div></div>
        <div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
        <div class="h">9am</div>
        <div class="t on"><div class="ev park">Target & Best Buy</div></div>
        <div class="t"></div><div class="t"><div class="ev park">Magic Kingdom</div></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
      </div>
    </div>
  </div>
</body>
</html>
