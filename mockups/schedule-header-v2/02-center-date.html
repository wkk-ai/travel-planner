<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02 · Center date</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../schedule-header/_shared.css" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .r1-clean .trip p { display: none; }
    .countdown-badge {
      font-size: 11px; font-weight: 600; color: var(--blue);
      background: #e8f0fe; padding: 3px 8px; border-radius: 6px; margin-left: 8px;
      white-space: nowrap;
    }
    .merge { justify-content: space-between; padding: 0 16px; }
    .merge-left { display: flex; align-items: center; gap: 12px; }
    .merge-center {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px;
    }
    .merge-wrap { position: relative; display: flex; align-items: center; flex: 1; justify-content: space-between; }
    .merge-center strong { font-size: 16px; font-weight: 700; }
    .merge-center .sub { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 6px; }
    .merge-right { display: flex; align-items: center; gap: 6px; }
    .text-toggle { font-size: 12px; font-weight: 600; color: var(--muted); border: none; background: none; font-family: inherit; cursor: default; padding: 6px 8px; }
    .text-toggle.on { color: var(--blue); }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Round 2 mockups</a>
  <p class="label">02 · Center date</p>
  <div class="phone">
    <div class="r1-clean">
      <div class="trip">
        <div class="trip-icon">📅</div>
        <div style="min-width:0;display:flex;align-items:center">
          <h1>BigBang US Trip 2026 ▾</h1>
          <span class="countdown-badge">21d · Concert 27d</span>
        </div>
      </div>
      <div class="search"><span>🔍</span> Search…</div>
      <div class="actions">
        <button class="icon-ghost">🔍</button>
        <button class="btn btn-primary">+ Add</button>
        <button class="icon-ghost">⋯</button>
      </div>
    </div>
    <div class="merge">
      <div class="merge-left">
        <div class="tabs-underline">
          <button>Story</button>
          <button class="on">Schedule</button>
        </div>
      </div>
      <div class="merge-wrap">
        <div class="merge-center">
          <button class="icon-ghost" style="width:28px;height:28px">‹</button>
          <strong>Sun, Aug 30</strong>
          <span class="sub">Day 2</span>
          <button class="icon-ghost" style="width:28px;height:28px">›</button>
        </div>
      </div>
      <div class="merge-right">
        <button class="text-toggle on">Day</button>
        <span style="color:var(--line)">|</span>
        <button class="text-toggle">Week</button>
        <button class="icon-ghost">⧉</button>
      </div>
    </div>
    <div class="cal">
      <div class="cal-grid">
        <div class="h"></div><div class="h">Sun</div><div class="h">Mon</div><div class="h">Tue</div><div class="h">Wed</div><div class="h">Thu</div><div class="h">Fri</div><div class="h">Sat</div>
        <div class="h">7am</div>
        <div class="t on"><div class="ev meal">Breakfast</div></div>
        <div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
        <div class="h">9am</div>
        <div class="t on"><div class="ev park">Target</div></div>
        <div class="t"></div><div class="t"><div class="ev park">Magic K.</div></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
      </div>
    </div>
  </div>
</body>
</html>
