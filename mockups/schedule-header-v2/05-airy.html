<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>05 · Airy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../schedule-header/_shared.css" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .r1-airy {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .r1-airy .trip-line {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .r1-airy .trip-line h1 { font-size: 15px; font-weight: 700; }
    .r1-airy .trip-line span { font-size: 12px; color: var(--muted); font-weight: 500; }
    .r1-airy .trip-line span::before { content: '·'; margin: 0 6px; color: var(--line-strong); }
    .r1-airy .search {
      max-width: 200px;
      padding: 8px 14px;
      border-color: var(--line);
      background: #fff;
    }
    .merge-airy {
      display: flex;
      align-items: center;
      padding: 10px 24px 12px;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .merge-airy .tabs-min {
      display: flex;
      gap: 16px;
    }
    .merge-airy .tabs-min button {
      border: none; background: none; font-family: inherit;
      font-size: 14px; font-weight: 600; color: var(--muted); cursor: default; padding: 0;
    }
    .merge-airy .tabs-min button.on { color: var(--blue); }
    .merge-airy .rule { width: 1px; height: 18px; background: var(--line); flex-shrink: 0; }
    .merge-airy .mid {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .merge-airy .mid .pill { background: var(--bg); border: none; }
    .merge-airy .mid .pill button { font-size: 12px; padding: 5px 12px; }
    .merge-airy .date-nav strong { font-size: 15px; font-weight: 700; }
    .merge-airy .end { margin-left: auto; display: flex; gap: 4px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Round 2 mockups</a>
  <p class="label">05 · Airy</p>
  <div class="phone">
    <div class="r1-airy">
      <div class="trip-line">
        <div class="trip-icon">📅</div>
        <h1>BigBang US Trip 2026 ▾</h1>
        <span>21d to go</span>
        <span>Concert 27d</span>
      </div>
      <div class="search"><span>🔍</span> Search…</div>
      <button class="btn btn-primary">+ Add</button>
      <button class="icon-ghost">⋯</button>
    </div>
    <div class="merge-airy">
      <div class="tabs-min">
        <button>Story</button>
        <button class="on">Schedule</button>
      </div>
      <div class="rule"></div>
      <div class="mid">
        <div class="pill"><button class="on">Day</button><button>Week</button></div>
        <div class="date-nav">
          <button class="icon-ghost" style="width:30px;height:30px">‹</button>
          <strong>Sun, Aug 30</strong>
          <button class="icon-ghost" style="width:30px;height:30px">›</button>
        </div>
      </div>
      <div class="end">
        <button class="icon-ghost" title="Jump to day">📅</button>
        <button class="icon-ghost" title="Filter categories">⧉</button>
      </div>
    </div>
    <div class="cal">
      <div class="cal-grid">
        <div class="h"></div><div class="h">Sun</div><div class="h">Mon</div><div class="h">Tue</div><div class="h">Wed</div><div class="h">Thu</div><div class="h">Fri</div><div class="h">Sat</div>
        <div class="h">7am</div>
        <div class="t on"><div class="ev meal">Breakfast</div></div>
        <div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
        <div class="h">9am</div>
        <div class="t on"><div class="ev park">Target</div></div>
        <div class="t"></div><div class="t"><div class="ev park">Magic K.</div></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
      </div>
    </div>
  </div>
</body>
</html>
