<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04 · Pill merge</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../schedule-header/_shared.css" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .r1-clean .trip-icon { width: 32px; height: 32px; font-size: 15px; border-radius: 8px; }
    .r1-clean .trip h1 { font-size: 14px; }
    .r1-clean .trip p { font-size: 10px; }
    .merge {
      padding: 8px 16px;
      gap: 12px;
      min-height: 48px;
    }
    .tabs-pill-wide {
      display: flex;
      background: var(--bg);
      border-radius: 999px;
      padding: 3px;
      flex-shrink: 0;
    }
    .tabs-pill-wide button {
      border: none; background: transparent; font-family: inherit;
      font-size: 13px; font-weight: 600; padding: 6px 16px; border-radius: 999px;
      color: var(--muted); cursor: default;
    }
    .tabs-pill-wide button.on { background: var(--blue); color: #fff; }
    .date-block {
      display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center;
    }
    .date-block .num {
      font-size: 13px; font-weight: 700; color: var(--blue);
      background: #e8f0fe; padding: 5px 10px; border-radius: 8px;
    }
    .date-block strong { font-size: 14px; font-weight: 600; color: var(--text); }
    .end-cluster { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .ghost-link {
      font-size: 12px; font-weight: 600; color: var(--muted);
      border: none; background: none; font-family: inherit; padding: 6px 8px; cursor: default;
    }
    .ghost-link.on { color: var(--blue); }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Round 2 mockups</a>
  <p class="label">04 · Pill merge</p>
  <div class="phone">
    <div class="r1-clean">
      <div class="trip">
        <div class="trip-icon">📅</div>
        <div style="min-width:0">
          <h1>BigBang US Trip 2026 ▾</h1>
          <p>21d to go · Concert in 27d</p>
        </div>
      </div>
      <div class="search"><span>🔍</span> Search events…</div>
      <div class="actions">
        <span class="live"><i></i> Live</span>
        <button class="btn btn-primary">+ Add</button>
        <button class="icon-ghost">⋯</button>
      </div>
    </div>
    <div class="merge">
      <div class="tabs-pill-wide">
        <button>Story</button>
        <button class="on">Schedule</button>
      </div>
      <div class="date-block">
        <button class="icon-ghost" style="width:28px;height:28px">‹</button>
        <span class="num">30</span>
        <strong>Sunday, Aug</strong>
        <button class="icon-ghost" style="width:28px;height:28px">›</button>
      </div>
      <div class="end-cluster">
        <button class="ghost-link on">Day</button>
        <button class="ghost-link">Week</button>
        <button class="icon-ghost">⧉</button>
      </div>
    </div>
    <div class="cal">
      <div class="cal-grid">
        <div class="h"></div><div class="h">Sun</div><div class="h">Mon</div><div class="h">Tue</div><div class="h">Wed</div><div class="h">Thu</div><div class="h">Fri</div><div class="h">Sat</div>
        <div class="h">7am</div>
        <div class="t on"><div class="ev meal">Breakfast</div></div>
        <div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
        <div class="h">9am</div>
        <div class="t on"><div class="ev park">Target</div></div>
        <div class="t"></div><div class="t"><div class="ev park">Magic K.</div></div><div class="t"></div><div class="t"></div><div class="t"></div><div class="t"></div>
      </div>
    </div>
  </div>
</body>
</html>
