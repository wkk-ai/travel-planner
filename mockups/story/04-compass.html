<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04 · Compass — Story mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --blue:#1a73e8; --muted:#70757a; --line:#dadce0; --bg:#f8f9fa; --text:#3c4043; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#e8eaed;min-height:100vh;padding:24px 16px;color:var(--text)}
    a.back{display:inline-block;margin-bottom:16px;color:var(--blue);font-size:13px;font-weight:600;text-decoration:none}
    .phone{max-width:390px;margin:0 auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(60,64,67,.18)}
    .top{padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700}
    .tabs{display:flex;border-bottom:1px solid var(--line)}
    .tabs span{flex:1;text-align:center;padding:14px;font-size:15px;font-weight:600;color:var(--muted)}
    .tabs span.on{color:var(--blue);border-bottom:2px solid var(--blue)}
    .slot{height:48px;background:var(--bg);border-bottom:1px solid var(--line);opacity:.4}
    .today-card{margin:16px;background:var(--blue);color:#fff;border-radius:16px;padding:18px}
    .today-card .tag{font-size:11px;font-weight:700;text-transform:uppercase;opacity:.85}
    .today-card h2{font-size:22px;font-weight:700;margin:6px 0 4px}
    .today-card p{font-size:14px;opacity:.9}
    .now{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25);font-size:14px}
    .strip{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
    .pill{flex-shrink:0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;min-width:72px;text-align:center}
    .pill small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
    .pill.cur{border-color:var(--blue);background:#e8f0fe;color:var(--blue)}
    .list{padding:0 16px 20px}
    .list h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
    .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f1f3f4;font-size:15px}
    .item .time{width:48px;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <a class="back" href="index.html">← All story mockups</a>
  <div class="phone">
    <div class="top">BigBang US Trip 2026</div>
    <div class="tabs"><span class="on">Story</span><span>Schedule</span></div>
    <div class="slot"></div>
    <div class="today-card">
      <div class="tag">Preview · trip not started</div>
      <h2>Day 1 starts in 21 days</h2>
      <p>Saturday Aug 29 · Orlando</p>
      <div class="now"><strong>First up:</strong> Flight CGH → CNF at 08:25</div>
    </div>
    <div class="strip">
      <div class="pill cur">29<small>Sat</small></div>
      <div class="pill">30<small>Sun</small></div>
      <div class="pill">31<small>Mon</small></div>
      <div class="pill">1<small>Tue</small></div>
      <div class="pill">2<small>Wed</small></div>
    </div>
    <div class="list">
      <h3>Saturday · Departure</h3>
      <div class="item"><span class="time">08:25</span>Flight CGH → CNF</div>
      <div class="item"><span class="time">14:00</span>Hotel check-in</div>
      <div class="item"><span class="time">15:30</span>Pick up rental car</div>
    </div>
  </div>
</body>
</html>
